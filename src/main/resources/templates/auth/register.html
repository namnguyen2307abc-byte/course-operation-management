<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
>
    <head th:replace="~{fragments/layout :: head('Create account')}"></head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main id="main-content" class="page-shell auth-shell">
            <div class="auth-heading">
                <span class="auth-symbol"><i data-lucide="user-round-plus" aria-hidden="true"></i></span>
                <p class="eyebrow">JOIN THE COMMUNITY</p>
                <h1>A fresh start.</h1>
                <p class="page-description">Create your Training Center account.</p>
            </div>
            <section class="auth-panel">
                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full name</label>
                        <input
                            id="fullName"
                            th:field="*{fullName}"
                            class="form-control"
                            autocomplete="name"
                            minlength="2"
                            maxlength="100"
                            placeholder="Your full name"
                            required
                            th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                            aria-describedby="fullName-error"
                        />
                        <div id="fullName-error" class="field-error" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input
                            id="email"
                            th:field="*{email}"
                            type="email"
                            class="form-control"
                            autocomplete="email"
                            maxlength="150"
                            placeholder="you@example.com"
                            required
                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                            aria-describedby="email-error"
                        />
                        <div id="email-error" class="field-error" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input
                            id="password"
                            th:field="*{password}"
                            type="password"
                            class="form-control"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="64"
                            required
                            aria-describedby="password-hint password-error"
                            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                        />
                        <div class="form-text" id="password-hint">Use 8 to 64 characters.</div>
                        <div id="password-error" class="field-error" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            type="password"
                            class="form-control"
                            autocomplete="new-password"
                            required
                            aria-describedby="confirmPassword-error"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                        />
                        <div
                            id="confirmPassword-error"
                            class="field-error"
                            th:errors="*{confirmPassword}"
                        ></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Create account
                        <i data-lucide="arrow-right" aria-hidden="true"></i>
                    </button>
                </form>
                <p class="auth-switch">
                    Already a member?
                    <a th:href="@{/login}">Sign in</a>
                </p>
            </section>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
