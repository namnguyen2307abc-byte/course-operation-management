<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell">
    <div class="auth-panel content-panel">
        <h1 class="h4 mb-3">Register</h1>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input id="fullName" th:field="*{fullName}" class="form-control" required>
                <div class="field-error" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" th:field="*{email}" type="email" class="form-control" required>
                <div class="field-error" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" th:field="*{password}" type="password" class="form-control" autocomplete="new-password" required>
                <div class="field-error" th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input id="confirmPassword" th:field="*{confirmPassword}" type="password" class="form-control" autocomplete="new-password" required>
                <div class="field-error" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <p class="mt-3 mb-0 text-center">
            <a th:href="@{/login}">Already have an account?</a>
        </p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
