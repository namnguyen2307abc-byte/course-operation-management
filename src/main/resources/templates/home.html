<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="content-panel">
        <h1 class="h3 mb-3">Course Operation Management</h1>
        <p class="mb-4">
            Base web foundation for a multi-discipline training center.
            Course Operation business modules are not implemented yet.
        </p>

        <div class="d-flex gap-2 flex-wrap" sec:authorize="isAnonymous()">
            <a class="btn btn-primary" th:href="@{/register}">Create Account</a>
            <a class="btn btn-outline-secondary" th:href="@{/login}">Login</a>
        </div>

        <div class="d-flex gap-2 flex-wrap" sec:authorize="isAuthenticated()">
            <a class="btn btn-primary" th:href="@{/profile}">View Profile</a>
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">Manage Users</a>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
