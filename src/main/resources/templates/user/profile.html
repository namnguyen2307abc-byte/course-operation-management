<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="content-panel">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <h1 class="h4 mb-0">Profile</h1>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/profile/change-password}">Change Password</a>
        </div>

        <dl class="row mb-0">
            <dt class="col-sm-3">Full Name</dt>
            <dd class="col-sm-9" th:text="${user.fullName}"></dd>

            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9" th:text="${user.email}"></dd>

            <dt class="col-sm-3">Role</dt>
            <dd class="col-sm-9" th:text="${user.role}"></dd>

            <dt class="col-sm-3">Status</dt>
            <dd class="col-sm-9" th:text="${user.status}"></dd>
        </dl>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
