<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
>
    <head th:replace="~{fragments/layout :: head('Password & security')}"></head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main id="main-content" class="page-shell">
            <header class="page-heading">
                <p class="eyebrow">PERSONAL WORKSPACE</p>
                <h1>My account</h1>
            </header>
            <nav class="section-tabs" aria-label="Account settings">
                <a th:href="@{/profile}">Profile</a>
                <a th:href="@{/profile/change-password}" aria-current="page">Password &amp; security</a>
            </nav>
            <div class="settings-layout">
                <aside>
                    <span class="action-icon coral">
                        <i data-lucide="shield-check" aria-hidden="true"></i>
                    </span>
                    <h2>Password &amp; security</h2>
                    <p class="text-muted">Keep your account personal.</p>
                </aside>
                <section class="settings-form">
                    <h2>Change password</h2>
                    <form
                        th:action="@{/profile/change-password}"
                        th:object="${changePasswordRequest}"
                        method="post"
                    >
                        <div class="mb-4">
                            <label for="currentPassword" class="form-label">Current password</label>
                            <input
                                id="currentPassword"
                                th:field="*{currentPassword}"
                                type="password"
                                class="form-control"
                                autocomplete="current-password"
                                required
                                aria-describedby="currentPassword-error"
                                th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                            />
                            <div
                                id="currentPassword-error"
                                class="field-error"
                                th:errors="*{currentPassword}"
                            ></div>
                        </div>
                        <div class="mb-4">
                            <label for="newPassword" class="form-label">New password</label>
                            <input
                                id="newPassword"
                                th:field="*{newPassword}"
                                type="password"
                                class="form-control"
                                autocomplete="new-password"
                                minlength="8"
                                maxlength="64"
                                required
                                aria-describedby="newPassword-error password-hint"
                                th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                            />
                            <div id="password-hint" class="form-text">Use 8 to 64 characters.</div>
                            <div id="newPassword-error" class="field-error" th:errors="*{newPassword}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm new password</label>
                            <input
                                id="confirmPassword"
                                th:field="*{confirmPassword}"
                                type="password"
                                class="form-control"
                                autocomplete="new-password"
                                required
                                aria-describedby="confirmPassword-error"
                                th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                            />
                            <div
                                id="confirmPassword-error"
                                class="field-error"
                                th:errors="*{confirmPassword}"
                            ></div>
                        </div>
                        <div class="form-actions">
                            <a class="btn btn-outline-secondary" th:href="@{/profile}">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i data-lucide="check" aria-hidden="true"></i>
                                Update password
                            </button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
