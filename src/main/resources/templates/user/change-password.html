<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell">
    <div class="auth-panel content-panel">
        <h1 class="h4 mb-3">Change Password</h1>

        <form th:action="@{/profile/change-password}" th:object="${changePasswordRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="currentPassword" class="form-label">Current Password</label>
                <input id="currentPassword" th:field="*{currentPassword}" type="password" class="form-control" autocomplete="current-password" required>
                <div class="field-error" th:errors="*{currentPassword}"></div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input id="newPassword" th:field="*{newPassword}" type="password" class="form-control" autocomplete="new-password" required>
                <div class="field-error" th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input id="confirmPassword" th:field="*{confirmPassword}" type="password" class="form-control" autocomplete="new-password" required>
                <div class="field-error" th:errors="*{confirmPassword}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/profile}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
