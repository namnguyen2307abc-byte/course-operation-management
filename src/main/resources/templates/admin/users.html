<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="content-panel">
        <h1 class="h4 mb-3">Users</h1>

        <form th:action="@{/admin/users}" method="get" class="row g-2 mb-4">
            <div class="col-md-5">
                <input name="keyword" th:value="${keyword}" class="form-control" placeholder="Search name or email">
            </div>
            <div class="col-md-3">
                <select name="role" class="form-select">
                    <option value="">All roles</option>
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role.name() == selectedRole}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">All statuses</option>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status.name() == selectedStatus}"></option>
                </select>
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-primary">Filter</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role}"></td>
                    <td>
                        <span class="badge" th:classappend="${user.status.name() == 'ACTIVE'} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${user.status}"></span>
                    </td>
                    <td class="text-end table-actions">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}(id=${user.id})}">View</a>
                    </td>
                </tr>
                <tr th:if="${users.empty}">
                    <td colspan="5" class="text-center text-muted">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${users.totalPages > 1}" aria-label="User pages">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${users.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${users.number - 1}, keyword=${keyword}, role=${selectedRole}, status=${selectedStatus})}">Previous</a>
                </li>
                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, users.totalPages - 1)}"
                    th:classappend="${pageNumber == users.number} ? ' active'">
                    <a class="page-link" th:text="${pageNumber + 1}"
                       th:href="@{/admin/users(page=${pageNumber}, keyword=${keyword}, role=${selectedRole}, status=${selectedStatus})}"></a>
                </li>
                <li class="page-item" th:classappend="${users.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/admin/users(page=${users.number + 1}, keyword=${keyword}, role=${selectedRole}, status=${selectedStatus})}">Next</a>
                </li>
            </ul>
        </nav>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
