<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-shell">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <section class="content-panel">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <h1 class="h4 mb-0">User Details</h1>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/users}">Back</a>
        </div>

        <dl class="row">
            <dt class="col-sm-3">Full Name</dt>
            <dd class="col-sm-9" th:text="${user.fullName}"></dd>

            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9" th:text="${user.email}"></dd>

            <dt class="col-sm-3">Role</dt>
            <dd class="col-sm-9" th:text="${user.role}"></dd>

            <dt class="col-sm-3">Status</dt>
            <dd class="col-sm-9" th:text="${user.status}"></dd>

            <dt class="col-sm-3">Created</dt>
            <dd class="col-sm-9" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>

            <dt class="col-sm-3">Updated</dt>
            <dd class="col-sm-9" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}"></dd>
        </dl>

        <div class="border-top pt-3 mt-3">
            <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <label for="role" class="form-label">Change Role</label>
                    <select id="role" name="role" class="form-select">
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role == user.role}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-grid">
                    <button type="submit" class="btn btn-primary">Update Role</button>
                </div>
            </form>
        </div>

        <div class="border-top pt-3 mt-3 d-flex gap-2">
            <form th:if="${user.status.name() == 'INACTIVE'}" th:action="@{/admin/users/{id}/activate(id=${user.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-success">Activate</button>
            </form>

            <form th:if="${user.status.name() == 'ACTIVE'}" th:action="@{/admin/users/{id}/deactivate(id=${user.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger">Deactivate</button>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
