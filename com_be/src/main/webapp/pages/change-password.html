<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            Đổi mật khẩu · Talent Center
        </title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/admin.css">
        <script defer src="../js/api.js">
        </script>
        <script defer src="../js/auth.js">
        </script>
        <script defer src="../js/change-password.js">
        </script>
    </head>
    <body class="admin-password-page">
        <main class="admin-password-card">
            <p class="eyebrow">
                BẢO MẬT TÀI KHOẢN
            </p>
            <h1>
                Đổi mật khẩu
            </h1>
            <p id="passwordContext" class="text-muted">
                Chọn mật khẩu mới để bảo vệ tài khoản của bạn.
            </p>
            <p id="passwordMessage" role="alert" class="alert alert-danger" hidden>
            </p>
            <form id="passwordForm">
                <label class="form-label" for="currentPassword">
                    Mật khẩu hiện tại / mật khẩu tạm
                </label>
                <input id="currentPassword" class="form-control" type="password" autocomplete="current-password" required>
                <label class="form-label" for="newPassword">
                    Mật khẩu mới (8–72 ký tự)
                </label>
                <input id="newPassword" class="form-control" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
                <label class="form-label" for="confirmPassword">
                    Nhập lại mật khẩu mới
                </label>
                <input id="confirmPassword" class="form-control" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
                <button id="savePassword" class="btn btn-primary w-100">
                    Lưu mật khẩu mới
                </button>
            </form>
            <div class="d-flex justify-content-between mt-3">
                <a id="backHome" href="../index.html">
                    Trang chủ
                </a>
                <button id="passwordLogout" class="btn btn-link p-0">
                    Đăng xuất
                </button>
            </div>
        </main>
    </body>
</html>
