<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Quản lý học phí</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><p>Đang mở Quản lý học phí…</p><script>
let user={};try{user=JSON.parse(localStorage.getItem('user'))||{};}catch{}
const base=location.pathname.startsWith('/com_fe/')?'/com_fe':'';
const page=String(user.role||'').replace(/^ROLE_/,'')==='PARENT'?'parent-tuition':'tuition-receivables';
const id=new URLSearchParams(location.search).get('invoiceId');
location.replace(base+'/pages/'+page+'.html'+(id?'?invoiceId='+encodeURIComponent(id):''));
</script></body></html>
