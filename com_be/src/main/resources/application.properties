spring.application.name=talent-management
spring.main.allow-bean-definition-overriding=true

# Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database Configuration (SQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=course_operation_management;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits (cho phép upload file ghi âm, video đàn piano)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Swagger Doc Path
springdoc.swagger-ui.path=/swagger-ui.html

# PayOS Payment Gateway & Webhook (Ngrok) Configuration
payos.client-id=${PAYOS_CLIENT_ID:72eaf300-9709-43ee-b390-a4219e902c60}
payos.api-key=${PAYOS_API_KEY:5b0f5c1a-b7f8-4774-95a5-600431b50480}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:f5c07d29fa0b9195ccffb9f054de89b0779065244ef6846e6cab407552cb44f7}
payos.create-payment-url=${PAYOS_CREATE_PAYMENT_URL:https://api-merchant.payos.vn/v2/payment-requests}
payos.return-url=${PAYOS_RETURN_URL:http://127.0.0.1:5500/pages/tuition-payment.html?payment=success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://127.0.0.1:5500/pages/tuition-payment.html?payment=cancelled}
payos.webhook-url=${PAYOS_WEBHOOK_URL:https://impart-agenda-dispatch.ngrok-free.dev/api/tuition-payment/payos-webhook}

