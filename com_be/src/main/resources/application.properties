spring.application.name=talent-management

# SQL Server Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=course_operation_management;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits (cho phép upload file ghi âm, video đàn piano)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Swagger Doc Path
springdoc.swagger-ui.path=/swagger-ui.html
