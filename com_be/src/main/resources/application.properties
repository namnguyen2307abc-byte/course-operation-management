spring.application.name=talent-management

# Database Configuration (Mặc định chạy H2 In-Memory sẵn sàng không cần cài đặt SQL Server, có thể cấu hình DB_URL để dùng SQL Server)
spring.datasource.url=${DB_URL:jdbc:h2:mem:course_operation_management;DB_CLOSE_DELAY=-1;MODE=MSSQLServer}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits (cho phép upload file ghi âm, video đàn piano)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Swagger Doc Path
springdoc.swagger-ui.path=/swagger-ui.html
