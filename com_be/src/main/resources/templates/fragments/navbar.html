<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
    <body>
        <header th:fragment="navbar" class="site-header">
            <a class="skip-link" href="#main-content">Skip to content</a>
            <nav class="nav-shell" aria-label="Main navigation">
                <a class="brand" th:href="@{/}">
                    <span class="brand-mark"><i data-lucide="graduation-cap" aria-hidden="true"></i></span>
                    <span>
                        Training Center
                        <small>LEARNING &amp; COMMUNITY</small>
                    </span>
                </a>
                <button
                    class="icon-button menu-toggle"
                    type="button"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Open navigation"
                    title="Open navigation"
                >
                    <i data-lucide="menu" aria-hidden="true"></i>
                </button>
                <div class="nav-content" id="mainNavbar">
                    <div class="nav-links">
                        <a class="nav-link" data-nav="/" th:href="@{/}">
                            <i data-lucide="layout-dashboard" aria-hidden="true"></i>
                            Overview
                        </a>
                        <a
                            class="nav-link"
                            data-nav="/admin/users"
                            th:href="@{/admin/users}"
                            sec:authorize="hasRole('ADMIN')"
                        >
                            <i data-lucide="users" aria-hidden="true"></i>
                            User directory
                        </a>
                        <a
                            class="nav-link"
                            data-nav="/profile"
                            th:href="@{/profile}"
                            sec:authorize="isAuthenticated()"
                        >
                            <i data-lucide="user-round" aria-hidden="true"></i>
                            My account
                        </a>
                    </div>
                    <div class="nav-account">
                        <a
                            class="nav-link"
                            data-nav="/login"
                            th:href="@{/login}"
                            sec:authorize="isAnonymous()"
                        >
                            Sign in
                        </a>
                        <a
                            class="btn btn-primary btn-sm"
                            th:href="@{/register}"
                            sec:authorize="isAnonymous()"
                        >
                            Create account
                            <i data-lucide="arrow-up-right" aria-hidden="true"></i>
                        </a>
                        <span class="session-label" sec:authorize="isAuthenticated()">
                            <i data-lucide="circle-user-round" aria-hidden="true"></i>
                            <span sec:authentication="name"></span>
                        </span>
                        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                            <button type="submit" class="icon-button" aria-label="Sign out" title="Sign out">
                                <i data-lucide="log-out" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </nav>
        </header>
    </body>
</html>
