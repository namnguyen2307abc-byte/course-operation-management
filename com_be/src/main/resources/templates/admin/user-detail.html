<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
>
    <head th:replace="~{fragments/layout :: head('User details')}"></head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main id="main-content" class="page-shell">
            <a class="back-link" th:href="@{/admin/users}">
                <i data-lucide="arrow-left" aria-hidden="true"></i>
                User directory
            </a>
            <div th:replace="~{fragments/messages :: messages}"></div>
            <header class="page-heading">
                <p class="eyebrow">ADMINISTRATION / ACCOUNT</p>
                <h1>User details</h1>
            </header>
            <div class="profile-layout">
                <aside class="identity-block">
                    <span
                        class="avatar avatar-large"
                        th:text="${#strings.toUpperCase(#strings.substring(user.fullName,0,1))}"
                    ></span>
                    <h2 th:text="${user.fullName}"></h2>
                    <p th:text="${user.email}"></p>
                    <span
                        class="status-badge"
                        th:classappend="${user.status.name() == 'ACTIVE'} ? 'active' : 'inactive'"
                        th:text="${user.status}"
                    ></span>
                </aside>
                <section class="details-section">
                    <div class="section-heading">
                        <h2>Account information</h2>
                        <i data-lucide="contact-round" aria-hidden="true"></i>
                    </div>
                    <dl class="detail-list">
                        <div>
                            <dt>Full name</dt>
                            <dd th:text="${user.fullName}"></dd>
                        </div>
                        <div>
                            <dt>Email address</dt>
                            <dd th:text="${user.email}"></dd>
                        </div>
                        <div>
                            <dt>Account role</dt>
                            <dd>
                                <span
                                    class="role-badge"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}"
                                ></span>
                            </dd>
                        </div>
                        <div>
                            <dt>Created</dt>
                            <dd th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy, HH:mm')}"></dd>
                        </div>
                        <div>
                            <dt>Last updated</dt>
                            <dd th:text="${#temporals.format(user.updatedAt, 'dd MMM yyyy, HH:mm')}"></dd>
                        </div>
                    </dl>
                    <div class="account-controls">
                        <h3>Role &amp; permissions</h3>
                        <form
                            th:action="@{/admin/users/{id}/role(id=${user.id})}"
                            method="post"
                            class="role-form"
                            data-confirm="Update this account's role?"
                        >
                            <div>
                                <label for="role" class="form-label">Account role</label>
                                <select id="role" name="role" class="form-select">
                                    <option
                                        th:each="role : ${roles}"
                                        th:value="${role}"
                                        th:text="${#strings.capitalize(#strings.toLowerCase(role.name()))}"
                                        th:selected="${role == user.role}"
                                    ></option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i data-lucide="check" aria-hidden="true"></i>
                                Update role
                            </button>
                        </form>
                    </div>
                    <div class="account-controls">
                        <h3>Account access</h3>
                        <form
                            th:if="${user.status.name() == 'INACTIVE'}"
                            th:action="@{/admin/users/{id}/activate(id=${user.id})}"
                            method="post"
                        >
                            <button type="submit" class="btn btn-outline-primary">
                                <i data-lucide="user-round-check" aria-hidden="true"></i>
                                Activate account
                            </button>
                        </form>
                        <form
                            th:if="${user.status.name() == 'ACTIVE'}"
                            th:action="@{/admin/users/{id}/deactivate(id=${user.id})}"
                            method="post"
                            data-confirm="Deactivate this account? This person will no longer be able to sign in."
                        >
                            <button type="submit" class="btn btn-outline-danger">
                                <i data-lucide="user-round-x" aria-hidden="true"></i>
                                Deactivate account
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
