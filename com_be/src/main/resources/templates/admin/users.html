<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
>
    <head th:replace="~{fragments/layout :: head('User directory')}"></head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main id="main-content" class="page-shell">
            <div th:replace="~{fragments/messages :: messages}"></div>
            <header class="directory-heading">
                <div class="page-heading">
                    <p class="eyebrow">ADMINISTRATION</p>
                    <h1>User directory</h1>
                    <p class="page-description">People at Training Center.</p>
                </div>
                <span class="count-label">
                    <i data-lucide="users" aria-hidden="true"></i>
                    <span th:text="${users.totalElements + ' users'}"></span>
                </span>
            </header>
            <section aria-label="User directory">
                <form th:action="@{/admin/users}" method="get" class="directory-toolbar">
                    <div>
                        <label for="keyword" class="form-label">Search people</label>
                        <div class="search-input">
                            <i data-lucide="search" aria-hidden="true"></i>
                            <input
                                id="keyword"
                                name="keyword"
                                th:value="${keyword}"
                                class="form-control"
                                placeholder="Name or email address"
                            />
                        </div>
                    </div>
                    <div>
                        <label for="role" class="form-label">Role</label>
                        <select id="role" name="role" class="form-select">
                            <option value="">All roles</option>
                            <option
                                th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(role.name()))}"
                                th:selected="${role.name() == selectedRole}"
                            ></option>
                        </select>
                    </div>
                    <div>
                        <label for="status" class="form-label">Status</label>
                        <select id="status" name="status" class="form-select">
                            <option value="">All statuses</option>
                            <option
                                th:each="status : ${statuses}"
                                th:value="${status}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(status.name()))}"
                                th:selected="${status.name() == selectedStatus}"
                            ></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="list-filter" aria-hidden="true"></i>
                        Apply
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Reset</a>
                </form>
                <div class="table-responsive" tabindex="0" role="region" aria-label="User results">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Email address</th>
                                <th scope="col">Role</th>
                                <th scope="col">Status</th>
                                <th scope="col" class="text-end">Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users.content}">
                                <td>
                                    <div class="person-cell">
                                        <span
                                            class="avatar"
                                            th:text="${#strings.toUpperCase(#strings.substring(user.fullName,0,1))}"
                                        ></span>
                                        <a
                                            th:href="@{/admin/users/{id}(id=${user.id})}"
                                            th:text="${user.fullName}"
                                        ></a>
                                    </div>
                                </td>
                                <td class="email-cell" th:text="${user.email}"></td>
                                <td>
                                    <span
                                        class="role-badge"
                                        th:text="${#strings.capitalize(#strings.toLowerCase(user.role.name()))}"
                                    ></span>
                                </td>
                                <td>
                                    <span
                                        class="status-badge"
                                        th:classappend="${user.status.name() == 'ACTIVE'} ? 'active' : 'inactive'"
                                        th:text="${#strings.capitalize(#strings.toLowerCase(user.status.name()))}"
                                    ></span>
                                </td>
                                <td class="text-end table-actions">
                                    <a
                                        class="icon-button"
                                        th:href="@{/admin/users/{id}(id=${user.id})}"
                                        th:aria-label="${'View ' + user.fullName}"
                                        title="View account"
                                    >
                                        <i data-lucide="arrow-up-right" aria-hidden="true"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${users.empty}">
                                <td colspan="5">
                                    <div class="empty-state">
                                        <i data-lucide="search-x" aria-hidden="true"></i>
                                        <h3>No matching users</h3>
                                        <p>Try another name or adjust your filters.</p>
                                        <a th:href="@{/admin/users}">Clear filters</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <span
                        th:text="${users.empty ? '0 results on this page' : 'Showing ' + (users.number * users.size + 1) + '-' + (users.number * users.size + users.numberOfElements) + ' of ' + users.totalElements + ' users'}"
                    ></span>
                    <nav th:if="${users.totalPages > 1}" aria-label="User pages">
                        <ul class="pagination">
                            <li class="page-item">
                                <a
                                    th:if="${!users.first}"
                                    class="page-link"
                                    th:href="@{/admin/users(page=${users.number - 1},keyword=${keyword},role=${selectedRole},status=${selectedStatus})}"
                                    aria-label="Previous page"
                                >
                                    <i data-lucide="chevron-left" aria-hidden="true"></i>
                                </a>
                                <span
                                    th:if="${users.first}"
                                    class="page-link text-muted"
                                    aria-disabled="true"
                                    aria-label="Previous page"
                                >
                                    <i data-lucide="chevron-left" aria-hidden="true"></i>
                                </span>
                            </li>
                            <li
                                class="page-item"
                                th:each="pageNumber : ${#numbers.sequence(T(java.lang.Math).max(0, users.number - 2), T(java.lang.Math).min(users.totalPages - 1, users.number + 2))}"
                                th:classappend="${pageNumber == users.number} ? 'active'"
                            >
                                <a
                                    class="page-link"
                                    th:text="${pageNumber + 1}"
                                    th:aria-current="${pageNumber == users.number} ? 'page' : null"
                                    th:href="@{/admin/users(page=${pageNumber},keyword=${keyword},role=${selectedRole},status=${selectedStatus})}"
                                ></a>
                            </li>
                            <li class="page-item">
                                <a
                                    th:if="${!users.last}"
                                    class="page-link"
                                    th:href="@{/admin/users(page=${users.number + 1},keyword=${keyword},role=${selectedRole},status=${selectedStatus})}"
                                    aria-label="Next page"
                                >
                                    <i data-lucide="chevron-right" aria-hidden="true"></i>
                                </a>
                                <span
                                    th:if="${users.last}"
                                    class="page-link text-muted"
                                    aria-disabled="true"
                                    aria-label="Next page"
                                >
                                    <i data-lucide="chevron-right" aria-hidden="true"></i>
                                </span>
                            </li>
                        </ul>
                    </nav>
                </div>
            </section>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
