<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
>
    <head th:replace="~{fragments/layout :: head('Sign in')}"></head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main id="main-content" class="page-shell auth-shell">
            <div class="auth-heading">
                <span class="auth-symbol"><i data-lucide="graduation-cap" aria-hidden="true"></i></span>
                <p class="eyebrow">YOUR TRAINING CENTER ACCOUNT</p>
                <h1>Welcome back.</h1>
                <p class="page-description">A new day. Something new to learn.</p>
            </div>
            <section class="auth-panel">
                <div th:replace="~{fragments/messages :: messages}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label for="username" class="form-label">Email address</label>
                        <input
                            id="username"
                            name="username"
                            type="email"
                            class="form-control"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        />
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Sign in
                        <i data-lucide="arrow-right" aria-hidden="true"></i>
                    </button>
                </form>
                <p class="auth-switch">
                    New to the community?
                    <a th:href="@{/register}">Create an account</a>
                </p>
            </section>
            <div class="auth-footnote">
                <i data-lucide="shield-check" aria-hidden="true"></i>
                Your personal learning space.
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
