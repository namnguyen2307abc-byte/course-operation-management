<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý lớp học - Talent Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
        .table > :not(caption) > * > * { vertical-align: middle; }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container my-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1">Quản lý lớp học</h2>
                <p class="text-muted mb-0">Tạo và cập nhật thông tin lớp cơ bản theo khóa học và cơ sở.</p>
            </div>
            <button id="newClassBtn" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Tạo lớp</button>
        </div>
        <div id="notice" class="alert d-none" role="alert"></div>
        <section class="panel p-3 mb-3" aria-label="Bộ lọc lớp học">
            <form id="filterForm" class="row g-2 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="keyword" class="form-label">Mã hoặc tên lớp</label>
                    <input id="keyword" class="form-control" placeholder="Nhập từ khóa">
                </div>
                <div class="col-12 col-md-3">
                    <label for="filterCourse" class="form-label">Khóa học</label>
                    <select id="filterCourse" class="form-select"><option value="">Tất cả khóa học</option></select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="filterBranch" class="form-label">Cơ sở</label>
                    <select id="filterBranch" class="form-select"><option value="">Tất cả cơ sở</option></select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="filterStatus" class="form-label">Trạng thái</label>
                    <select id="filterStatus" class="form-select">
                        <option value="">Tất cả</option>
                        <option value="PLANNING">Dự kiến</option>
                        <option value="OPEN">Đang mở</option>
                        <option value="IN_PROGRESS">Đang học</option>
                        <option value="FINISHED">Đã kết thúc</option>
                    </select>
                </div>
                <div class="col-12 col-md-1 d-grid"><button class="btn btn-outline-primary" type="submit">Lọc</button></div>
            </form>
        </section>
        <section class="panel p-3" aria-label="Danh sách lớp học">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="fw-bold mb-0">Danh sách lớp</h5>
                <span id="resultCount" class="text-muted small"></span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Mã / tên lớp</th><th>Khóa học</th><th>Cơ sở</th><th>Sĩ số</th><th>Ngày dự kiến</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody id="classRows"><tr><td colspan="7" class="text-center text-muted py-4">Đang tải...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>

    <div class="modal fade" id="classModal" tabindex="-1" aria-labelledby="classModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="classForm">
                    <div class="modal-header">
                        <h5 id="classModalTitle" class="modal-title">Tạo lớp</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <div id="formError" class="alert alert-danger d-none" role="alert"></div>
                        <div class="row g-3">
                            <div class="col-md-6"><label for="courseId" class="form-label">Khóa học *</label><select id="courseId" class="form-select" required></select></div>
                            <div class="col-md-6"><label for="branchId" class="form-label">Cơ sở *</label><select id="branchId" class="form-select" required></select></div>
                            <div class="col-md-6"><label for="classCode" class="form-label">Mã lớp *</label><input id="classCode" class="form-control" maxlength="50" pattern="[A-Za-z0-9][A-Za-z0-9_-]*" required></div>
                            <div class="col-md-6"><label for="className" class="form-label">Tên lớp *</label><input id="className" class="form-control" maxlength="150" required></div>
                            <div class="col-md-4"><label for="maxStudents" class="form-label">Sĩ số tối đa *</label><input id="maxStudents" type="number" class="form-control" min="1" step="1" required></div>
                            <div class="col-md-4"><label for="startDate" class="form-label">Bắt đầu dự kiến *</label><input id="startDate" type="date" class="form-control" required></div>
                            <div class="col-md-4"><label for="endDate" class="form-label">Kết thúc dự kiến *</label><input id="endDate" type="date" class="form-control" required></div>
                            <div class="col-md-6"><label for="status" class="form-label">Trạng thái *</label><select id="status" class="form-select" required>
                                <option value="PLANNING">Dự kiến</option><option value="OPEN">Đang mở</option><option value="IN_PROGRESS">Đang học</option><option value="FINISHED">Đã kết thúc</option>
                            </select></div>
                        </div>
                        <p class="text-muted small mt-3 mb-0">Sĩ số hiện tại được hệ thống cập nhật khi thanh toán. Buổi học, phòng và giáo viên được quản lý ở chức năng khác.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button id="saveBtn" type="submit" class="btn btn-primary">Lưu lớp</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        checkAuth();
        const role = String(getCurrentUser()?.role || '').toUpperCase().replace('ROLE_', '');
        if (!['STAFF', 'ADMIN'].includes(role)) {
            window.location.replace('/index.html');
        }

        const $ = id => document.getElementById(id);
        const modal = new bootstrap.Modal($('classModal'));
        const statusNames = {PLANNING: 'Dự kiến', OPEN: 'Đang mở', IN_PROGRESS: 'Đang học', FINISHED: 'Đã kết thúc'};
        let editingId = null;
        let classes = [];

        fetch('../components/navbar.html').then(r => r.text()).then(html => {
            $('navbar-container').innerHTML = html;
            updateNavbarUser();
        });
        fetch('../components/footer.html').then(r => r.text()).then(html => $('footer-container').innerHTML = html);

        function escapeHtml(value) {
            return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
        }
        function notice(message, type = 'success') {
            $('notice').className = `alert alert-${type}`;
            $('notice').textContent = message;
        }
        function formError(message) {
            $('formError').textContent = message;
            $('formError').classList.toggle('d-none', !message);
        }
        function optionList(items, label) {
            return `<option value="">${label}</option>` + items.map(item =>
                `<option value="${item.id}">${escapeHtml(item.code ? item.code + ' — ' : '')}${escapeHtml(item.name)}</option>`).join('');
        }
        async function loadOptions() {
            const [courses, branches] = await Promise.all([
                callApi('/api/course-enrollment/courses'),
                callApi('/api/branches/options')
            ]);
            const courseOptions = optionList(courses || [], 'Chọn khóa học');
            const branchOptions = optionList(branches || [], 'Chọn cơ sở');
            $('courseId').innerHTML = courseOptions;
            $('branchId').innerHTML = branchOptions;
            $('filterCourse').innerHTML = optionList(courses || [], 'Tất cả khóa học');
            $('filterBranch').innerHTML = optionList(branches || [], 'Tất cả cơ sở');
        }
        async function loadClasses() {
            const params = new URLSearchParams();
            for (const [key, id] of [['keyword','keyword'], ['courseId','filterCourse'], ['branchId','filterBranch'], ['status','filterStatus']]) {
                const value = $(id).value.trim();
                if (value) params.set(key, value);
            }
            classes = await callApi('/api/class-management/classes' + (params.size ? '?' + params : '')) || [];
            $('resultCount').textContent = `${classes.length} lớp`;
            $('classRows').innerHTML = classes.length ? classes.map(item => `
                <tr>
                    <td><strong>${escapeHtml(item.classCode)}</strong><br><span class="text-muted">${escapeHtml(item.className)}</span></td>
                    <td>${escapeHtml(item.courseName)}</td>
                    <td>${escapeHtml(item.branchName)}</td>
                    <td>${item.currentStudents} đã học / ${item.pendingPaymentStudents} chờ tiền / ${item.maxStudents} tối đa<br><small class="text-muted">Còn ${item.availableSeats} chỗ</small></td>
                    <td>${escapeHtml(item.startDate)}<br><span class="text-muted">đến ${escapeHtml(item.endDate)}</span></td>
                    <td>${escapeHtml(statusNames[item.status] || item.status)}</td>
                    <td><button type="button" class="btn btn-sm btn-outline-primary" data-edit-id="${item.id}">Sửa</button></td>
                </tr>`).join('') : '<tr><td colspan="7" class="text-center text-muted py-4">Chưa có lớp phù hợp</td></tr>';
        }
        $('newClassBtn').addEventListener('click', () => {
            editingId = null;
            $('classForm').reset();
            formError('');
            $('classModalTitle').textContent = 'Tạo lớp';
            $('status').value = 'PLANNING';
            modal.show();
        });
        $('classRows').addEventListener('click', event => {
            const button = event.target.closest('[data-edit-id]');
            if (!button) return;
            const item = classes.find(c => String(c.id) === button.dataset.editId);
            if (!item) return;
            editingId = item.id;
            formError('');
            $('classModalTitle').textContent = 'Sửa lớp ' + item.classCode;
            for (const id of ['courseId','branchId','classCode','className','maxStudents','status','startDate','endDate']) {
                $(id).value = item[id] ?? '';
            }
            modal.show();
        });
        $('filterForm').addEventListener('submit', event => {
            event.preventDefault();
            loadClasses().catch(() => notice('Không tải được danh sách lớp.', 'danger'));
        });
        $('classForm').addEventListener('submit', async event => {
            event.preventDefault();
            const startDate = $('startDate').value;
            const endDate = $('endDate').value;
            if (endDate < startDate) {
                formError('Ngày kết thúc phải từ ngày bắt đầu trở đi.');
                return;
            }
            formError('');
            const payload = {
                courseId: Number($('courseId').value), branchId: Number($('branchId').value),
                classCode: $('classCode').value.trim(), className: $('className').value.trim(),
                maxStudents: Number($('maxStudents').value), status: $('status').value,
                startDate, endDate
            };
            $('saveBtn').disabled = true;
            try {
                await callApi(editingId ? `/api/class-management/classes/${editingId}` : '/api/class-management/classes',
                    editingId ? 'PUT' : 'POST', payload);
                modal.hide();
                notice(editingId ? 'Đã cập nhật lớp.' : 'Đã tạo lớp.');
                await loadClasses();
            } catch (error) {
                formError(error.message || 'Không lưu được lớp.');
            } finally {
                $('saveBtn').disabled = false;
            }
        });
        loadOptions().then(loadClasses).catch(() => notice('Không tải được dữ liệu lớp.', 'danger'));
    </script>
</body>
</html>
